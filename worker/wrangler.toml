# 말문 AI 중계 서버 (Cloudflare Workers)
# 배포:  cd worker && npx wrangler deploy
# 비밀 값(저장소에 넣지 않음):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put INVITE_CODES     # 쉼표로 구분, 예: FRIEND01,FRIEND02
name = "malmun-coach"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 하루 사용 횟수를 세는 KV 저장소. 아래 id는 `npx wrangler kv namespace create QUOTA` 결과로 바꿔 넣는다.
[[kv_namespaces]]
binding = "QUOTA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# 허용할 앱 주소 (쉼표 구분). GitHub Pages 주소와 로컬 개발 주소만.
ALLOWED_ORIGINS = "https://ybxxyb5959-droid.github.io,http://localhost:4180,http://localhost:4181,http://127.0.0.1:4180"
# 하루 한도
MEMBER_DAILY_LIMIT = "50"
GUEST_DAILY_LIMIT = "3"
# 모델 순서 (앞에서부터 시도, 429/5xx면 다음)
MODELS = "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
